version: "1.0.0"

# Core Decision Thresholds
amber_threshold: 0.35
red_threshold: 0.50
hold_minutes: 30

# Family Contribution Thresholds (A family "fires" when contribution >= threshold)
family_thresholds:
  A: 0.40  # Session Coercion (on_call, screen_shared, remote_app, hesitation)
  B: 0.40  # Payee Risk (first_time, account_age, high fan-in, lookalike, reports)
  C: 0.35  # Context (bad link, suspicious note, deep link)
  D: 0.35  # User Baseline (amount_ratio >= 4.0 or escalation_ratio >= 2.0)


# Trusted Payee Rule: 3+ payments over 30+ days skips scoring unless Family A fires
trusted_payee:
  min_payments: 3
  min_history_days: 30

# Eligibility Gate: Score only if first-time/recent payee OR amount_ratio is high OR Family A signals active
eligibility_gate:
  min_amount_ratio: 2.0
  force_first_time: true
  bypass_on_family_a: true
  bypass_on_lookalike: 0.70

# Large payment to a stranger: amber when a payee who is not yet trusted (trusted_payee above), not a
# saved contact and not a verified merchant gets at least this much (INR), counting the last 24 hours
# to them. Floor chosen on validation worlds 33, 44, 55.
stranger_amount_floor: 25000

# Screen sharing / a new remote-access app warns on its own, except for a payee paid this many times
# over this many days while no unknown caller is on the line. Chosen on validation world 33 (over the
# trusted-payee 3 / 30), confirmed on 44 and 55.
coercion_known_payee:
  min_payments: 2
  min_history_days: 7

# Amber for a caller who is not a saved contact + a first-time payee + an amount at least min_amount_ratio
# times the user's usual, when the model score is at least min_score (coached transfers under the
# stranger floor). Chosen on validation world 33, confirmed on 44 and 55.
unknown_caller_amber:
  min_amount_ratio: 4.0
  min_score: 0.7

# "This was me" lowers a later amber for the payee only up to this multiple of the vouched amount (and
# never with a known-bad link or a scam-story note). From the population review on world 33, confirmed on
# 33, 44 and 55.
vouch_max_amount_ratio: 1.5

# Execution Safeguards
timeout_ms: 300
fail_open_on_error: true

